<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>广告素材上传投放系统</title>
</head>
<body>
    <h2>上传图片/视频素材</h2>
    <div>
        <input type="file" id="mediaFile" accept="image/*,video/*">
        <button id="uploadBtn" onclick="uploadFile()">上传素材</button>
    </div>
    <div id="uploadResult"></div>

    <h3>投放参数</h3>
    <div>
        <label>广告组名称：</label><input type="text" id="group_name"><br>
        <label>广告计划名称：</label><input type="text" id="plan_name"><br>
        <label>创意名称：</label><input type="text" id="creative_name"><br>
        <label>广告组日预算：</label><input type="number" id="budget" value="100"><br>
        <label>计划出价：</label><input type="number" id="bid" value="1"><br>
        <button id="launchBtn" onclick="launchAd()">执行抖音投放</button>
    </div>
    <div id="launchResult"></div>

<script>
let localFilePath = "";

// 按钮置灰/恢复工具：请求进行中禁止重复点击
function setBusy(btn, busy, busyText){
    btn.disabled = busy;
    btn.dataset.normalText = btn.dataset.normalText || btn.innerText;
    btn.innerText = busy ? busyText : btn.dataset.normalText;
}

async function uploadFile(){
    const fileInput = document.getElementById("mediaFile");
    const file = fileInput.files[0];
    if(!file){alert("请选择文件");return;}
    const btn = document.getElementById("uploadBtn");
    if(btn.disabled) return;  // 上传中不允许重复点
    setBusy(btn, true, "上传中…");
    document.getElementById("uploadResult").innerText = "上传中，请稍候…";
    try{
        const formData = new FormData();
        formData.append("file", file);
        const resp = await fetch("/api/upload", {method:"POST", body:formData});
        const res = await resp.json();
        document.getElementById("uploadResult").innerText = JSON.stringify(res,null,2);
        if(res.success){
            localFilePath = res.local_file_path;
        }
    }catch(e){
        document.getElementById("uploadResult").innerText = "上传请求失败：" + e;
    }finally{
        setBusy(btn, false);
    }
}

async function launchAd(){
    if(!localFilePath){alert("请先上传素材");return;}
    const btn = document.getElementById("launchBtn");
    if(btn.disabled) return;  // 投放中不允许重复点
    setBusy(btn, true, "投放中，请稍候…");
    document.getElementById("launchResult").innerText = "正在创建千川计划，请稍候（约10-30秒）…";
    try{
        const payload = {
            "platform":"douyin",
            "local_file_path": localFilePath,
            "ad_group_name": document.getElementById("group_name").value,
            "ad_plan_name": document.getElementById("plan_name").value,
            "creative_name": document.getElementById("creative_name").value,
            "budget": parseFloat(document.getElementById("budget").value),
            "bid": parseFloat(document.getElementById("bid").value)
        };
        const resp = await fetch("/api/ad/launch", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify(payload)
        });
        const res = await resp.json();
        document.getElementById("launchResult").innerText = JSON.stringify(res,null,2);
    }catch(e){
        document.getElementById("launchResult").innerText = "投放请求失败：" + e;
    }finally{
        setBusy(btn, false);
    }
}
</script>
</body>
</html>
