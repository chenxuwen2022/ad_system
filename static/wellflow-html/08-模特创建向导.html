<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创建模特 · WellFlow</title>
<style>
:root{
  --brand-green:#CCFF00;--brand-green-deep:#A8D400;--brand-green-soft:#1A2E0A;
  --ink-900:#FFFFFF;--ink-700:#B8B8B8;--ink-500:#8A8A8A;--ink-400:#6A6A6A;--ink-300:#5A5A5A;--ink-200:#3A3A3A;
  --pearl:#0F0F0F;--pearl-2:#1A1A1A;--border:#2A2A2A;
  --radius-md:10px;--radius-lg:16px;--shadow-md:0 4px 12px rgba(10,10,10,.08);
  --font:'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-size:14px;color:var(--ink-900);background:var(--pearl-2);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;outline:none}
img{display:block;max-width:100%}
.top-nav{display:flex;align-items:center;gap:16px;height:60px;padding:0 28px;background:#1A1A1A;border-bottom:1px solid var(--border)}
.nav-back{font-size:14px;color:var(--ink-500);padding:6px 12px;border-radius:8px}
.nav-back:hover{background:var(--pearl-2)}
.nav-logo{display:flex;align-items:center;gap:10px;font-weight:700}
.nav-logo-mark{width:26px;height:26px;border-radius:7px;background:var(--brand-green);display:grid;place-items:center;font-size:13px;font-weight:800;color:#000}

.wrap{max-width:1100px;margin:28px auto;padding:0 24px}
.steps{display:flex;gap:0;background:#1A1A1A;border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:20px}
.step{flex:1;text-align:center;position:relative}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--pearl-2);color:var(--ink-400);display:grid;place-items:center;margin:0 auto 6px;font-weight:700;font-size:13px}
.step .t{font-size:12.5px;color:var(--ink-500)}
.step.active .n{background:var(--brand-green);color:#0A0A0A}
.step.active .t{color:var(--ink-900);font-weight:600}
.step.done .n{background:var(--brand-green);color:#000}
.step:not(:last-child)::after{content:'';position:absolute;top:15px;left:60%;width:80%;height:2px;background:var(--border);z-index:0}
.step.done:not(:last-child)::after{background:var(--brand-green)}

.card{background:#1A1A1A;border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;margin-bottom:20px}
.card h2{font-size:18px;font-weight:700;margin-bottom:6px}
.card .sub{color:var(--ink-500);font-size:13.5px;margin-bottom:20px}

.dropzone{border:1.5px dashed var(--ink-200);border-radius:var(--radius-md);padding:36px;text-align:center;color:var(--ink-400)}
.dropzone:hover{border-color:var(--brand-green-deep);background:var(--brand-green-soft)}
.preview-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.pv{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--pearl-2)}
.pv img{width:100%;height:100%;object-fit:cover}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fg .lab{font-size:13px;color:var(--ink-500);margin-bottom:6px;display:block}
.fg input,.fg select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:14px;background:#1A1A1A;color:#fff}
.fg input:focus,.fg select:focus{border-color:var(--brand-green-deep)}

.tag-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tag{padding:7px 14px;border:1.5px solid var(--border);border-radius:999px;font-size:13px;color:var(--ink-500)}
.tag.on{background:var(--brand-green);color:#0A0A0A;border-color:var(--ink-900)}

.gen-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.gen{aspect-ratio:3/4;border-radius:var(--radius-md);overflow:hidden;border:2px solid var(--border);position:relative}
.gen.sel{border-color:var(--brand-green-deep)}
.gen img{width:100%;height:100%;object-fit:cover}
.gen .badge{position:absolute;top:8px;left:8px;background:var(--brand-green);color:#000;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}

.footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.btn{padding:12px 26px;border-radius:999px;font-size:14px;font-weight:600}
.btn-primary{background:var(--brand-green);color:#000}
.btn-ghost{border:1.5px solid var(--border);color:var(--ink-700)}
.code-hint{font-size:12.5px;color:var(--ink-400)}
.code-hint b{color:var(--ink-900)}
</style>
</head>
<body>

<nav class="top-nav">
  <button class="nav-back" onclick="location.href='02-资产库.html'">← 返回资产库</button>
  <div class="nav-logo"><div class="nav-logo-mark">W</div><span>创建模特</span></div>
</nav>

<div class="wrap">
  <div class="steps">
    <div class="step done"><div class="n">✓</div><div class="t">上传参考图</div></div>
    <div class="step done"><div class="n">✓</div><div class="t">填写信息</div></div>
    <div class="step active"><div class="n">3</div><div class="t">AI 生成</div></div>
    <div class="step"><div class="n">4</div><div class="t">确认入库</div></div>
  </div>

  <div class="card">
    <h2>选择生成方案</h2>
    <p class="sub">AI 已根据你的参考图与信息生成 3 套模特方案，选择一套入库。</p>
    <div class="gen-grid">
      <div class="gen sel"><span class="badge">推荐</span><img src="assets/ref-model-card-woman-eastasian-white.png"></div>
      <div class="gen"><img src="assets/ref-model-card-cool-white.png"></div>
      <div class="gen"><img src="assets/ref-model-card-fashion-olive.png"></div>
    </div>
  </div>

  <div class="card">
    <h2>模特信息</h2>
    <p class="sub">入库后可在模特库中直接调用。</p>
    <div class="form-grid">
      <div class="fg"><label class="lab">模特名称</label><input value="东亚女模 · 通勤白"></div>
      <div class="fg"><label class="lab">身高（cm）</label><input value="168"></div>
      <div class="fg"><label class="lab">年龄段</label><select><option>25-30 岁</option><option>20-25 岁</option><option>30-35 岁</option></select></div>
      <div class="fg"><label class="lab">气质风格</label><select><option>通勤气质</option><option>清新自然</option><option>高级冷感</option></select></div>
    </div>
    <div style="margin-top:16px">
      <label class="lab" style="font-size:13px;color:var(--ink-500)">标签</label>
      <div class="tag-row">
        <span class="tag on">通勤</span><span class="tag on">东亚女</span><span class="tag">商务</span>
        <span class="tag">清新</span><span class="tag">高级感</span>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="code-hint">入库编号：<b>WF-M008</b>（自动生成）</div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost">上一步</button>
      <button class="btn btn-primary" onclick="alert('已入库到模特库')">确认入库 →</button>
    </div>
  </div>
</div>

<script>
document.querySelectorAll('.gen').forEach(g=>g.addEventListener('click',()=>{document.querySelectorAll('.gen').forEach(x=>x.classList.remove('sel'));g.classList.add('sel');}));
document.querySelectorAll('.tag').forEach(t=>t.addEventListener('click',()=>t.classList.toggle('on')));
</script>
</body>
</html>
