<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务详情 · WellFlow</title>
<style>
:root{--bg:#0F0F0F;--card:#1E2416;--card2:#1A1F14;--line:#2E3A1E;--green:#CCFF00;--text:#fff;--t2:#C8D4B8;--t3:#8A9A78}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Noto Sans SC','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:32px}
.eyebrow{font-size:11px;color:var(--t3);letter-spacing:2px;margin-bottom:8px}
h1{font-size:24px;font-weight:700;margin-bottom:16px}
.back{display:inline-block;padding:9px 16px;border-radius:9px;background:var(--card);border:1px solid var(--line);color:var(--text);font-size:14px;cursor:pointer;margin-bottom:20px}
.back:hover{background:#2A331E}
.head-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.head-row .title{font-size:20px;font-weight:700}
.badge{padding:5px 12px;border-radius:20px;font-size:12.5px;font-weight:600}
.badge.done{background:rgba(82,196,26,.15);color:#52C41A;border:1px solid rgba(82,196,26,.3)}
.badge.fail{background:rgba(234,102,104,.15);color:#EA6668;border:1px solid rgba(234,102,104,.3)}
.badge.doing{background:rgba(204,255,0,.12);color:var(--green);border:1px solid rgba(204,255,0,.3)}
.meta{font-size:13px;color:var(--t3);margin-bottom:20px}
.meta b{color:var(--text)}

.steps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:20px}
.step{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;align-items:center;gap:12px}
.step .chk{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:15px;flex:none}
.step .chk.ok{background:var(--green);color:#000}
.step .chk.bad{background:#EA6668;color:#fff}
.step .chk.wait{background:#333;color:var(--t3)}
.step .lb{font-weight:600;font-size:15px}
.step .sub{font-size:12.5px;color:var(--t3);margin-top:2px}

.ok-box{border-radius:12px;padding:16px 20px;margin-bottom:20px}
.ok-box.good{background:rgba(82,196,26,.08);border:1px solid rgba(82,196,26,.2)}
.ok-box.good .t{font-weight:600;color:#52C41A;margin-bottom:4px}
.ok-box.bad{background:rgba(234,102,104,.08);border:1px solid rgba(234,102,104,.2)}
.ok-box.bad .t{font-weight:600;color:#EA6668;margin-bottom:4px}
.ok-box .d{font-size:13px;color:var(--t2);word-break:break-all}

.progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.progress-row .lb{font-weight:600;font-size:15px}
.progress-row .val{font-size:13px;color:var(--t3)}
.progress-row .val b{color:var(--green)}
.progress{height:6px;background:#222;border-radius:3px;overflow:hidden;margin-bottom:8px}
.progress .bar{height:100%;border-radius:3px}
.progress .bar.good{background:var(--green)}
.progress .bar.bad{background:#EA6668}
.progress .bar.doing{background:#FAAD14}
.note{font-size:12.5px;color:var(--t3);margin-bottom:24px}

h3{font-size:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:8px}
.tab{padding:5px 12px;border-radius:6px;background:#222;color:var(--t3);font-size:12.5px;border:1px solid #333}

.mat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:24px;max-width:320px}
.mat .thumb{width:120px;height:150px;border-radius:6px;background:#222;margin-bottom:10px;object-fit:cover}
.mat .nm{font-weight:600;font-size:14px;margin-bottom:4px;word-break:break-all}
.mat .st{font-size:13px}
.mat .st.ok{color:#52C41A}
.mat .st.bad{color:#EA6668}
.mat .st.doing{color:var(--green)}

.result-head{display:flex;justify-content:space-between;color:var(--t3);font-size:13px;margin-bottom:12px}
.result{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:24px}
.result .plan-name{font-weight:600;font-size:15px;margin-bottom:6px}
.result .pid{font-size:12.5px;color:var(--t3);margin-bottom:4px;word-break:break-all}
.result .sku{font-size:12.5px;color:var(--t3);margin-bottom:14px;word-break:break-all}
.result .cols{display:grid;grid-template-columns:1fr 140px 140px;gap:12px;font-size:14px}
.result .ok{color:#52C41A;font-weight:600}
.result .bad{color:#EA6668;font-weight:600}
.result .mid{color:var(--t3)}

.foot{font-size:13px;color:var(--t3);border-top:1px solid var(--line);padding-top:16px}
.loading{padding:60px;text-align:center;color:var(--t3)}
</style>
</head>
<body>
  <div class="eyebrow">MATERIAL WORKSPACE</div>
  <h1>投放任务</h1>
  <button class="back" onclick="history.back()">← 返回任务列表</button>

  <div id="root"><div class="loading">加载中…</div></div>

<script>
const params=new URLSearchParams(location.search);
const taskId=parseInt(params.get('id'));

function basename(p){
  return (p||'').replace(/\\/g,'/').split('/').pop()||'';
}
function isVideo(name){
  return /\.(mp4|mov|avi|mkv|webm)$/i.test(name||'');
}

async function load(){
  let TASK=null, SHOP_NAME='';
  try{
    const [recRes, shopRes]=await Promise.all([
      fetch('/api/launch_records?limit=500').then(r=>r.json()),
      fetch('/api/shops').then(r=>r.json()),
    ]);
    const recs=(recRes&&recRes.data)||[];
    TASK=recs.find(t=>t.id===taskId)||recs[0];
    if(!TASK){ document.getElementById('root').innerHTML='<div class="loading">未找到该任务记录</div>'; return; }
    const shops=Array.isArray(shopRes)?shopRes:(shopRes.data||[]);
    const shop=shops.find(s=>String(s.advertiser_id)===String(TASK.advertiser_id));
    SHOP_NAME=shop?shop.shop_name:(TASK.advertiser_id||'店铺');
  }catch(e){
    document.getElementById('root').innerHTML='<div class="loading">加载失败：'+e.message+'</div>';
    return;
  }
  render(TASK, SHOP_NAME);
}

function render(t, shopName){
  const done=t.status==='success';
  const fail=t.status==='fail';
  const doing=!done&&!fail;
  const date=(t.create_time||'').slice(0,16);
  const fileName=basename(t.file_path);
  const fileType=isVideo(fileName)?'video':'image';
  const mediaUrl='/api/uploaded_media/'+encodeURIComponent(fileName||'');

  // 步骤状态：成功全绿勾；失败=上传✓ 关联✗ 启动✗；进行中=上传✓ 关联/启动等待
  const s1=done||fail?'ok':'ok';
  const s2=done?'ok':(fail?'bad':'wait');
  const s3=done?'ok':(fail?'bad':'wait');
  const chk=k=>({ok:'<span class="chk ok">✓</span>',bad:'<span class="chk bad">✕</span>',wait:'<span class="chk wait">…</span>'})[k];

  const title=done?'任务已完成':(fail?'任务失败':'任务进行中');
  const badgeCls=done?'done':(fail?'fail':'doing');
  const badgeTxt=done?'已完成':(fail?'失败':'进行中');

  const boxCls=done?'good':'bad';
  const boxTitle=done?'1 份素材上传成功，1 个计划已启动投放':'投放失败';
  const boxDetail=(t.detail||'处理中…');

  const progPct=done?100:(fail?100:50);
  const progCls=done?'good':(fail?'bad':'doing');
  const progTxt=done?'1 / 1 份成功 · 100%':(fail?'0 / 1 份成功 · 100%':'1 / 2 步 · 50%');

  const stCls=done?'ok':(fail?'bad':'doing');
  const stTxt=done?'上传成功':(fail?'上传失败':'上传处理中');

  const planName=t.plan_name||t.plan_id||'（未指定计划）';
  const planId=t.plan_id||'-';
  const skuId=(t.product_id||'').split(',')[0]||'-';

  const relState=done?'ok':(fail?'bad':'mid');
  const relTxt=done?'已关联':(fail?'关联失败':'关联中');
  const startTxt=done?'已启动投放':(fail?'未启动':'启动中');

  document.getElementById('root').innerHTML=`
    <div class="head-row">
      <div class="title">${title}</div>
      <span class="badge ${badgeCls}">${badgeTxt}</span>
    </div>
    <div class="meta">广告主 ID: <b>${t.advertiser_id||'-'}</b> · ${shopName} · ${date} 创建</div>

    <div class="steps">
      <div class="step">${chk(s1)}<div><div class="lb">上传素材</div><div class="sub">1 / 1 份${done||fail?'完成':'上传中'}</div></div></div>
      <div class="step">${chk(s2)}<div><div class="lb">关联计划</div><div class="sub">${done?'1 / 1 个已关联':(fail?'关联失败':'处理中')}</div></div></div>
      <div class="step">${chk(s3)}<div><div class="lb">启动投放</div><div class="sub">${done?'1 / 1 个已启动':(fail?'未启动':'处理中')}</div></div></div>
    </div>

    <div class="ok-box ${boxCls}">
      <div class="t">${boxTitle}</div>
      <div class="d">${boxDetail}</div>
    </div>

    <div class="progress-row">
      <span class="lb">素材上传进度</span>
      <span class="val"><b>${progPct}%</b> · ${progTxt}</span>
    </div>
    <div class="progress"><div class="bar ${progCls}" style="width:${progPct}%"></div></div>
    <div class="note">每批最多 5 份，按批次依次上传。</div>

    <h3>素材明细
      <div class="tabs">
        <span class="tab">全部 1</span>
        <span class="tab">${fail?'失败 1':'失败 0'}</span>
        <span class="tab">${doing?'待完成 1':'待完成 0'}</span>
        <span class="tab">${done?'成功 1':'成功 0'}</span>
      </div>
    </h3>
    <div class="mat">
      ${fileType==='video'
        ? '<video class="thumb" src="'+mediaUrl+'" muted controls></video>'
        : '<img class="thumb" src="'+mediaUrl+'">'}
      <div class="nm">${fileName||'（素材文件已清理）'}</div>
      <div class="st ${stCls}">${stTxt}</div>
    </div>

    <div class="result-head">
      <span style="font-weight:600">计划投放结果</span>
      <span>素材将关联到以下计划</span>
    </div>
    <div class="result">
      <div class="plan-name">${planName}</div>
      <div class="pid">计划 ID：${planId}</div>
      <div class="sku">SKU ID：${skuId}</div>
      <div class="cols">
        <span></span>
        <span class="${relState}">${relTxt}</span>
        <span class="${relState}">${startTxt}</span>
      </div>
    </div>

    <div class="foot">关闭窗口后任务仍会继续，可从"投放任务"重新查看。</div>
  `;
}

load();
</script>
</body>
</html>
