<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无限画布 · WellFlow</title>
<style>
:root{
  --brand-green:#CCFF00;--brand-green-deep:#A8D400;--brand-green-soft:#1A2E0A;
  --ink-900:#FFFFFF;--ink-500:#8A8A8A;--ink-400:#6A6A6A;--ink-300:#5A5A5A;--ink-200:#3A3A3A;
  --pearl:#0F0F0F;--pearl-2:#1A1A1A;--border:#2A2A2A;
  --radius-md:10px;--radius-lg:16px;
  --font:'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);overflow:hidden;background:#0F0F0F;color:var(--ink-900)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

.toolbar{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:8px;background:#1A1A1A;border:1px solid var(--border);border-radius:999px;padding:8px 16px;box-shadow:0 8px 24px rgba(0,0,0,.1);font-size:13px}
.toolbar .logo{font-weight:700;margin-right:8px}
.tbtn{padding:6px 14px;border-radius:999px;font-size:13px;color:var(--ink-500)}
.tbtn:hover{background:var(--pearl-2)}
.tbtn.on{background:var(--brand-green);color:#0A0A0A;font-weight:600}

.zoom{position:fixed;bottom:24px;right:24px;z-index:100;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:10px;background:#1A1A1A;border:1px solid var(--border);font-size:18px;box-shadow:0 4px 12px rgba(0,0,0,.08)}

.canvas{position:absolute;inset:0;background-image:radial-gradient(circle,#c9c9cf 1px,transparent 1px);background-size:24px 24px}
.node{position:absolute;background:#1A1A1A;border:1.5px solid var(--border);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.08);width:160px;overflow:hidden;cursor:grab;user-select:none}
.node:active{cursor:grabbing}
.node.sel{border-color:var(--brand-green-deep);box-shadow:0 6px 24px rgba(168,212,0,.35)}
.node .head{padding:8px 10px;font-size:11.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.node .head .type{font-size:10px;color:var(--brand-green-deep);font-weight:700}
.node .pic{aspect-ratio:3/4;background:var(--pearl-2)}
.node .pic img{width:100%;height:100%;object-fit:cover}
.node .cap{padding:8px 10px;font-size:11.5px;color:var(--ink-500);line-height:1.4}
svg.lines{position:absolute;inset:0;pointer-events:none;z-index:0}
.legend{position:fixed;bottom:24px;left:24px;z-index:100;background:#1A1A1A;border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-size:12px;color:var(--ink-500);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.legend b{color:var(--ink-900)}
</style>
</head>
<body>

<div class="toolbar">
  <span class="logo">W</span>
  <button class="tbtn on">选择</button>
  <button class="tbtn">手型</button>
  <button class="tbtn">AI 生成</button>
  <button class="tbtn">↶</button>
  <button class="tbtn">↷</button>
  <span style="color:var(--ink-300)">|</span>
  <button class="tbtn">适应屏幕</button>
</div>

<div class="canvas" id="canvas">
  <svg class="lines">
    <path d="M 320 200 C 460 200, 460 240, 600 240" stroke="#c9c9cf" stroke-width="2" fill="none" stroke-dasharray="6 5"/>
    <path d="M 320 380 C 460 380, 460 300, 600 300" stroke="#c9c9cf" stroke-width="2" fill="none" stroke-dasharray="6 5"/>
    <path d="M 760 270 C 900 270, 900 260, 1040 260" stroke="#CCFF00" stroke-width="2.5" fill="none"/>
  </svg>

  <div class="node" style="left:160px;top:120px">
    <div class="head">商品原图 <span class="type">ORIGIN</span></div>
    <div class="pic"><img src="assets/shirt-front.jpg"></div>
    <div class="cap">儿童纯棉衬衫 · 正面</div>
  </div>

  <div class="node" style="left:160px;top:360px">
    <div class="head">商品侧图 <span class="type">ORIGIN</span></div>
    <div class="pic"><img src="assets/shirt-side.jpg"></div>
    <div class="cap">侧面细节</div>
  </div>

  <div class="node sel" style="left:600px;top:180px">
    <div class="head">参考模特 <span class="type">REF</span></div>
    <div class="pic"><img src="assets/ref-model-card-woman-eastasian-white.png"></div>
    <div class="cap">东亚女模 · 通勤白</div>
  </div>

  <div class="node" style="left:600px;top:380px">
    <div class="head">参考场景 <span class="type">REF</span></div>
    <div class="pic"><img src="assets/ref-background-city.png"></div>
    <div class="cap">都市街景</div>
  </div>

  <div class="node" style="left:1040px;top:180px">
    <div class="head">生成结果 <span class="type" style="color:var(--brand-green-deep)">AI</span></div>
    <div class="pic"><img src="assets/result-1.jpg" onerror="this.src='assets/shirt-front.jpg'"></div>
    <div class="cap">投流图 A · 已入库</div>
  </div>
</div>

<div class="zoom">
  <button>＋</button>
  <button>－</button>
  <button style="font-size:12px">100%</button>
</div>

<div class="legend">
  <b>无限画布</b> · 拖拽节点自由编排，连线表示创作来源。点击节点查看详情。
</div>

<script>
document.querySelectorAll('.node').forEach(n=>{
  let ox=0,oy=0,drag=false;
  n.addEventListener('mousedown',e=>{drag=true;ox=e.offsetX;oy=e.offsetY;document.querySelectorAll('.node').forEach(x=>x.classList.remove('sel'));n.classList.add('sel');});
  window.addEventListener('mousemove',e=>{if(drag){n.style.left=(e.clientX-ox)+'px';n.style.top=(e.clientY-oy)+'px';}});
  window.addEventListener('mouseup',()=>drag=false);
});
</script>
</body>
</html>
