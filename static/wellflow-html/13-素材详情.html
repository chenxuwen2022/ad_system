<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>素材详情 · WellFlow</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
:root{--bg:#0F0F0F;--card:#1A1F14;--card2:#1E2416;--line:#2E3A1E;--green:#CCFF00;--red:#FF6B6B;--yellow:#FAAD14;--blue:#69C0FF;--text:#fff;--t2:#C8D4B8;--t3:#8A9A78;--t4:#5A6A48}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Noto Sans SC','PingFang SC',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
button,input,select{font-family:inherit;outline:none}
button{cursor:pointer;border:none;background:none;color:inherit}
.eyebrow{font-size:12px;color:var(--t3);letter-spacing:2px;margin-bottom:10px}
h1{font-size:26px;font-weight:700}
.page{max-width:1500px;margin:0 auto;padding:30px 36px 100px}
.head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}
.close{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--t2);font-size:20px}
.close:hover{background:var(--card2)}

.hero{display:grid;grid-template-columns:520px 1fr;gap:36px;margin-bottom:28px}
@media(max-width:1100px){.hero{grid-template-columns:1fr}}
.player{background:#000;border-radius:14px;aspect-ratio:3/4;max-height:560px;display:grid;place-items:center;position:relative;overflow:hidden}
.player img,.player video{width:100%;height:100%;object-fit:cover}
.player .badge-01{position:absolute;top:12px;right:14px;font-size:11px;color:rgba(255,255,255,.7)}
.pinfo .status{display:inline-block;padding:5px 14px;border-radius:8px;background:rgba(82,196,26,.15);color:#52C41A;font-size:13px;font-weight:600;margin-bottom:14px}
.pinfo .status.st-pause{background:rgba(250,173,20,.15);color:var(--yellow)}
.pinfo .status.st-review{background:rgba(105,192,255,.15);color:var(--blue)}
.pinfo h2{font-size:28px;font-weight:700;margin-bottom:8px;word-break:break-all}
.pinfo .idline{color:var(--t3);font-size:13px;margin-bottom:22px}
.kv{display:grid;grid-template-columns:120px 1fr;row-gap:12px;column-gap:10px;font-size:14px}
.kv .k{color:var(--t3)}
.kv .v{color:var(--text)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.tag{padding:5px 12px;border-radius:7px;background:rgba(120,160,40,.18);color:var(--green);font-size:12.5px;border:1px solid #3A5A10}
.tag.gray{background:var(--card2);color:var(--t2);border-color:var(--line)}

.card{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:18px}
.card h3{font-size:18px;font-weight:700;margin-bottom:6px}
.card .desc{color:var(--t3);font-size:13px;margin-bottom:18px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.export{padding:9px 16px;border-radius:8px;background:var(--card);border:1px solid var(--line);color:var(--text);font-size:13px}
.export:hover{border-color:var(--green)}

.ai3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;margin-top:18px}
@media(max-width:900px){.ai3{grid-template-columns:1fr}}
.ai3>div{padding:14px 24px;border-left:1px solid var(--line)}
.ai3>div:first-child{border-left:none;padding-left:0}
@media(max-width:900px){.ai3>div{border-left:none;padding:14px 0;border-top:1px solid var(--line)}.ai3>div:first-child{border-top:none}}
.ai3 .lb{color:var(--t3);font-size:12.5px}
.ai3 .ttl{font-size:16px;font-weight:700;margin:8px 0 6px}
.ai3 .num{font-size:13px;color:var(--t2);margin-bottom:10px}
.ai3 .hint{font-size:12.5px;color:var(--t3);line-height:1.6}
.agent-btn{padding:10px 18px;border-radius:9px;background:var(--green);color:#000;font-weight:600;font-size:13px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:12px 14px;color:var(--t3);font-weight:600;font-size:12.5px;border-bottom:1px solid var(--line)}
td{padding:14px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
.num-big{font-size:22px;font-weight:700;color:var(--green)}
.up{color:#52C41A}.down{color:var(--red)}
.tabs-mini{display:flex;gap:6px;flex-wrap:wrap}
.tabs-mini button{padding:7px 14px;border-radius:8px;background:var(--card);border:1px solid var(--line);color:var(--t2);font-size:12.5px}
.tabs-mini button.on{background:var(--green);color:#000;font-weight:600;border-color:var(--green)}

.funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
@media(max-width:900px){.funnel{grid-template-columns:1fr 1fr}}
.fstage{background:linear-gradient(135deg,rgba(120,160,40,.25),rgba(60,80,30,.15));border-radius:12px;padding:18px}
.fstage .n{font-size:11px;color:var(--t3);margin-bottom:6px}
.fstage .v{font-size:26px;font-weight:700;color:var(--green)}
.fstage .nm{font-size:14px;margin-top:12px}
.fstage .sub{font-size:11.5px;color:var(--t3);margin-top:4px}

.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-top:14px}
@media(max-width:900px){.grid5{grid-template-columns:repeat(2,1fr)}}
.grid5>div{padding:14px;border-right:1px solid var(--line)}
.grid5>div:last-child{border-right:none}
.grid5 .lb{color:var(--t3);font-size:12.5px}
.grid5 .v{font-size:22px;font-weight:700;margin-top:6px}

.chart{width:100%;height:340px}
.ai-text{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;font-size:13.5px;line-height:1.8;color:var(--t2);white-space:pre-wrap;margin-top:12px}
.metrics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
@media(max-width:900px){.metrics-grid{grid-template-columns:repeat(2,1fr)}}
.metric-item{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.metric-item .lb{font-size:11.5px;color:var(--t3)}
.metric-item .v{font-size:16px;font-weight:600;margin-top:4px;color:var(--green)}
.loading{padding:80px;text-align:center;color:var(--t3)}
.footer{margin-top:30px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:12px}
.btn{padding:11px 22px;border-radius:9px;font-size:14px}
.ghost{background:var(--card);border:1px solid var(--line);color:var(--text)}
.primary{background:var(--green);color:#000;font-weight:600}
.muted{color:var(--t3)}
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <div>
      <div class="eyebrow">MATERIAL WORKSPACE</div>
      <h1>素材详情</h1>
    </div>
</div>

  <div id="content"><div class="loading">加载中...</div></div>
</div>

<script>
const qs=new URLSearchParams(location.search);
const MID=qs.get('material_id')||'';
const MNAME=qs.get('name')||'';
const MPATH=qs.get('path')||'';
const MTYPE=qs.get('type')||'';
const CONTENT=document.getElementById('content');

function fmt(v,dec=2){if(v===null||v===undefined||v==='')return '—';const n=Number(v);if(isNaN(n))return v;return n.toLocaleString('zh-CN',{maximumFractionDigits:dec,minimumFractionDigits:0});}
function money(v){if(v===null||v===undefined||v==='')return '—';const n=Number(v);if(isNaN(n))return v;return '¥ '+n.toLocaleString('zh-CN',{maximumFractionDigits:2});}
function pct(v){if(v===null||v===undefined||v==='')return '—';return Number(v).toFixed(2)+'%';}
function diff(cur,prev){if(!prev||prev===0)return '<span class="muted">—</span>';const d=(cur-prev)/prev*100;const cls=d>=0?'up':'down';const s=(d>=0?'+':'')+d.toFixed(1)+'%';return '<span class="'+cls+'">'+s+'</span>';}

function renderLocalShell(){
  // 本地上传素材（无千川 material_id）：显示所有字段，没有就为空
  const url='/api/uploaded_media/'+encodeURIComponent(MPATH||MNAME);
  const cover=MTYPE==='video'||/\.(mp4|mov|avi|mkv|webm)$/i.test(MNAME)
    ? '<video src="'+url+'" muted controls autoplay loop></video>'
    : '<img src="'+url+'" alt="">';
  const fn=MNAME.replace(/\.[^.]+$/,'');
  const mtype=MTYPE==='video'?'视频':'图片';

  CONTENT.innerHTML=
  '<div class="hero">'+
    '<div class="player">'+cover+'<span class="badge-01">本地上传</span></div>'+
    '<div class="pinfo">'+
      '<span class="status st-pause">未投放</span>'+
      '<h2>'+fn+'</h2>'+
      '<div class="idline">本地素材 · 未关联千川计划</div>'+
      '<div class="kv">'+
        '<span class="k">素材类型</span><span class="v">'+mtype+'</span>'+
        '<span class="k">素材来源</span><span class="v">—</span>'+
        '<span class="k">素材样式</span><span class="v">—</span>'+
        '<span class="k">创意方式</span><span class="v">—</span>'+
        '<span class="k">在投计划数</span><span class="v">—</span>'+
        '<span class="k">投放天数</span><span class="v">—</span>'+
        '<span class="k">近7天趋势</span><span class="v">—</span>'+
        '<span class="k">30天同比</span><span class="v">—</span>'+
      '</div>'+
    '</div>'+
  '</div>'+

  // 当前素材表现 5 大数字
  '<div class="card"><h3>当前素材表现</h3>'+
    '<div class="grid5">'+
      '<div><div class="lb">消耗</div><div class="v">—</div></div>'+
      '<div><div class="lb">成交金额</div><div class="v">—</div></div>'+
      '<div><div class="lb">点击率 CTR</div><div class="v">—</div></div>'+
      '<div><div class="lb">转化率 CVR</div><div class="v">—</div></div>'+
      '<div><div class="lb">ROI</div><div class="v">—</div></div>'+
    '</div>'+
  '</div>'+

  // 核心投放指标表
  '<div class="card"><h3>核心投放指标</h3>'+
    '<div class="desc">统计范围：近90天 · 投放后显示数据</div>'+
    '<table><thead><tr><th>指标</th><th>数值</th><th>说明</th></tr></thead><tbody>'+
    '<tr><td><b>消耗</b></td><td class="num-big">—</td><td>累计花费</td></tr>'+
    '<tr><td><b>成交金额</b></td><td class="num-big">—</td><td>支付口径</td></tr>'+
    '<tr><td><b>净成交金额</b></td><td class="num-big">—</td><td>结算口径（ROI2）</td></tr>'+
    '<tr><td><b>点击率</b></td><td class="num-big">—</td><td>点击/展示</td></tr>'+
    '<tr><td><b>转化率</b></td><td class="num-big">—</td><td>成交/点击</td></tr>'+
    '<tr><td><b>ROI</b></td><td class="num-big">—</td><td>成交/消耗</td></tr>'+
    '</tbody></table></div>'+

  // AI 点评
  '<div class="card"><div class="card-head"><div><h3>✨ AI 点评与修改建议</h3>'+
    '<div class="desc">投放后自动生成</div></div>'+
    '<button class="agent-btn">与 Agent 对话 ↗</button></div>'+
    '<div class="desc">暂无数据...</div>'+
  '</div>'+

  // 全部报表指标
  '<div class="card"><h3>全部报表指标（0 项）</h3>'+
    '<div class="desc">投放后自动拉取全量指标</div>'+
  '</div>'+

  // 转化漏斗
  '<div class="card"><h3>素材转化漏斗</h3>'+
    '<div class="funnel">'+
      '<div class="fstage"><div class="n">01</div><div class="v">—</div><div class="nm">广告素材点击</div><div class="sub">—</div></div>'+
      '<div class="fstage"><div class="n">02</div><div class="v">—</div><div class="nm">展示</div><div class="sub">—</div></div>'+
      '<div class="fstage"><div class="n">03</div><div class="v">—</div><div class="nm">成交订单</div><div class="sub">—</div></div>'+
      '<div class="fstage"><div class="n">04</div><div class="v">—</div><div class="nm">成交金额</div><div class="sub">—</div></div>'+
    '</div></div>';
}

async function loadDetail(){
  if(!MID){renderLocalShell();return;}
  try{
    const r=await fetch('/api/material_detail?material_id='+encodeURIComponent(MID));
    const d=await r.json();
    if(!d.success){CONTENT.innerHTML='<div class="card">加载失败：'+(d.error||'未知错误')+'</div>';return;}
    renderDetail(d);
  }catch(e){
    CONTENT.innerHTML='<div class="card">加载失败：'+e.message+'</div>';
  }
}

function renderDetail(d){
  const s=d.summary||{};
  const daily=d.daily||[];
  const ai=d.ai||'';
  const pv=d.preview||{};
  const meta=s.material_meta||{};
  const mtype=s.type||'视频';

  // 头部预览
  let cover='';
  if(pv.video_url||pv.cover_url){
    cover=pv.video_url
      ? '<video src="'+pv.video_url+'" poster="'+(pv.cover_url||'')+'" controls></video>'
      : '<img src="'+(pv.cover_url||pv.image_url||'')+'">';
  }else if(MPATH||MNAME){
    const url='/api/uploaded_media/'+encodeURIComponent(MPATH||MNAME);
    cover=mtype==='video'?'<video src="'+url+'" controls></video>':'<img src="'+url+'">';
  }else{
    cover='<div style="color:#666">无预览</div>';
  }

  // 日期范围
  const first=s.first_day||'—', last=s.last_day||'—';
  const days=s.active_days||0;

  // 逐日数据 → 趋势图
  const dates=daily.map(x=>x.date);
  const costs=daily.map(x=>x.cost);
  const gmvs=daily.map(x=>x.gmv);
  const clicks=daily.map(x=>x.click);
  const shows=daily.map(x=>x.show);
  const orders=daily.map(x=>x.orders);

  // 核心指标
  const cost=Number(s.消耗||0);
  const gmv=Number(s.成交金额||0);
  const ctr=s.点击率||0;
  const cvr=s.转化率||0;
  const roi=Number(s.支付ROI||0);
  const shows2=Number(s.展示||0);
  const clicks2=Number(s.点击||0);
  const orders2=Number(s.成交单数||0);

  // 近7 vs 前7
  const recent7=s.recent7_cost||0, prev7=s.prev7_cost||0;
  const trendDir=s.trend||'—';

  // 25 项全量指标
  const metricsAll=s.metrics_all||[];

  CONTENT.innerHTML=
  '<div class="hero">'+
    '<div class="player">'+cover+'<span class="badge-01">'+mtype+'</span></div>'+
    '<div class="pinfo">'+
      '<span class="status st-live">在投</span>'+
      '<h2>'+(s.name||MNAME||'素材')+'</h2>'+
      '<div class="idline">ID '+MID+' · 成片 · '+mtype+'</div>'+
      '<div class="kv">'+
        '<span class="k">素材类型</span><span class="v">'+mtype+'</span>'+
        '<span class="k">素材来源</span><span class="v">'+(meta.source||'—')+'</span>'+
        '<span class="k">素材样式</span><span class="v">'+(meta.image_mode||'—')+'</span>'+
        '<span class="k">创意方式</span><span class="v">'+(meta.creative_way||'—')+'</span>'+
        '<span class="k">在投计划数</span><span class="v">'+(meta.in_delivery_plans??'—')+'</span>'+
        '<span class="k">投放天数</span><span class="v">'+days+' 天（'+first+' ~ '+last+'）</span>'+
        '<span class="k">近7天趋势</span><span class="v">'+trendDir+'（近7天 ¥'+fmt(recent7)+' vs 前7天 ¥'+fmt(prev7)+'）</span>'+
        '<span class="k">30天同比</span><span class="v">'+(s.yoy_trend||'—')+'</span>'+
      '</div>'+
    '</div>'+
  '</div>'+

  // 当前素材表现 5 大数字
  '<div class="card"><h3>当前素材表现</h3>'+
    '<div class="grid5">'+
      '<div><div class="lb">消耗</div><div class="v">'+money(cost)+'</div></div>'+
      '<div><div class="lb">成交金额</div><div class="v">'+money(gmv)+'</div></div>'+
      '<div><div class="lb">点击率 CTR</div><div class="v">'+pct(ctr)+'</div></div>'+
      '<div><div class="lb">转化率 CVR</div><div class="v">'+pct(cvr)+'</div></div>'+
      '<div><div class="lb">ROI</div><div class="v">'+fmt(roi)+'</div></div>'+
    '</div>'+
  '</div>'+

  // 核心投放指标表
  '<div class="card"><h3>核心投放指标</h3>'+
    '<div class="desc">统计范围：近90天（'+first+' ~ '+last+'）· 消耗 ¥'+fmt(cost)+' · 展示 '+fmt(shows2,0)+' · 点击 '+fmt(clicks2,0)+' · 成交 '+fmt(orders2,0)+' 单</div>'+
    '<table><thead><tr><th>指标</th><th>数值</th><th>说明</th></tr></thead><tbody>'+
    '<tr><td><b>消耗</b></td><td class="num-big">'+money(cost)+'</td><td>累计花费</td></tr>'+
    '<tr><td><b>成交金额</b></td><td class="num-big">'+money(gmv)+'</td><td>支付口径</td></tr>'+
    '<tr><td><b>净成交金额</b></td><td class="num-big">'+money(s.净成交金额)+'</td><td>结算口径（ROI2）</td></tr>'+
    '<tr><td><b>点击率</b></td><td class="num-big">'+pct(ctr)+'</td><td>点击/展示</td></tr>'+
    '<tr><td><b>转化率</b></td><td class="num-big">'+pct(cvr)+'</td><td>成交/点击</td></tr>'+
    '<tr><td><b>ROI</b></td><td class="num-big">'+fmt(roi)+'</td><td>成交/消耗</td></tr>'+
    '</tbody></table></div>'+

  // 投放趋势
  '<div class="card"><h3>投放趋势</h3>'+
    '<div class="desc">近90天逐日消耗/成交曲线</div>'+
    '<div id="trend" class="chart"></div></div>'+

  // AI 点评
  '<div class="card"><div class="card-head"><div><h3>✨ AI 点评与修改建议</h3>'+
    '<div class="desc">DeepSeek 基于投放数据自动生成（不看画面，纯数据诊断）</div></div>'+
    '<button class="agent-btn">与 Agent 对话 ↗</button></div>'+
    (ai?'<div class="ai-text">'+ai+'</div>':'<div class="desc">AI 点评生成中或暂无数据...</div>')+
  '</div>'+

  // 25 项全量指标
  '<div class="card"><h3>全部报表指标（'+metricsAll.length+' 项）</h3>'+
    '<div class="metrics-grid">'+
    (metricsAll.map(m=>'<div class="metric-item"><div class="lb">'+m.cn+'</div><div class="v">'+fmt(m.value,2)+'</div></div>').join('')||'<div class="desc">暂无全量指标数据</div>')+
    '</div></div>'+

  // 转化漏斗
  '<div class="card"><h3>素材转化漏斗</h3>'+
    '<div class="funnel">'+
      '<div class="fstage"><div class="n">01</div><div class="v">'+fmt(clicks2,0)+'</div><div class="nm">广告素材点击</div><div class="sub">100%</div></div>'+
      '<div class="fstage"><div class="n">02</div><div class="v">'+fmt(shows2,0)+'</div><div class="nm">展示</div><div class="sub">—</div></div>'+
      '<div class="fstage"><div class="n">03</div><div class="v">'+fmt(orders2,0)+'</div><div class="nm">成交订单</div><div class="sub">'+pct(cvr)+'</div></div>'+
      '<div class="fstage"><div class="n">04</div><div class="v">'+money(gmv)+'</div><div class="nm">成交金额</div><div class="sub">ROI '+fmt(roi)+'</div></div>'+
    '</div></div>'+

  ''+
  '<button class="btn primary">加入选择</button></div>';

  // 画趋势图
  setTimeout(()=>{
    const el=document.getElementById('trend');
    if(!el||typeof echarts==='undefined')return;
    const t=echarts.init(el);
    t.setOption({
      backgroundColor:'transparent',
      grid:{left:60,right:20,top:40,bottom:40},
      legend:{textStyle:{color:'#C8D4B8'},top:0},
      tooltip:{trigger:'axis',backgroundColor:'#1A1F14',borderColor:'#2E3A1E',textStyle:{color:'#fff'}},
      xAxis:{type:'category',data:dates,axisLine:{lineStyle:{color:'#3A4432'}},axisLabel:{color:'#8A9A78'}},
      yAxis:[
        {type:'value',name:'消耗',axisLabel:{color:'#8A9A78',formatter:'¥{value}'},splitLine:{lineStyle:{color:'#2A3320'}}},
        {type:'value',name:'成交',axisLabel:{color:'#8A9A78',formatter:'¥{value}'},splitLine:{show:false}}
      ],
      series:[
        {name:'消耗',type:'line',data:costs,smooth:true,lineStyle:{color:'#CCFF00',width:2.5},itemStyle:{color:'#CCFF00'}},
