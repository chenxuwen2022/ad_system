<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>创建场景 - WellFlow AI 电商商拍创作平台</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #0e1117; color: #e8eaed; min-height: 100vh;
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.modal {
  width: 640px; max-width: 96vw;
  background: #161b22; border: 1px solid #30363d; border-radius: 16px;
  padding: 24px 28px 20px; position: relative;
  box-shadow: 0 18px 50px rgba(0,0,0,.55);
}
/* 标题行 */
.head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.head h2 { font-size: 18px; font-weight: 700; }
.close { width: 30px; height: 30px; border-radius: 8px; background: #21262d; color: #8b949e; border: none; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.close:hover { background: #30363d; color: #fff; }

/* 演示提示 */
.demo-tip {
  display: flex; gap: 8px; align-items: center;
  background: #17233b; border: 1px solid #2b5bff44; border-radius: 8px;
  padding: 8px 12px; font-size: 12px; color: #7ea0ff; margin-bottom: 20px;
}
.demo-tip .tag { flex-shrink: 0; color: #ffd83d; font-weight: 600; }

/* 步骤条 */
.steps { display: flex; gap: 10px; margin-bottom: 24px; }
.step {
  flex: 1; display: flex; align-items: center; gap: 8px;
  background: #21262d; border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #8b949e;
}
.step .num {
  width: 22px; height: 22px; border-radius: 50%;
  background: #30363d; color: #8b949e;
  display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
  flex-shrink: 0;
}
.step.on { background: #1c2a4d; border: 1px solid #2b5bff66; color: #c9d1d9; }
.step.on .num { background: #2b5bff; color: #fff; }

/* 上传区 */
.upload {
  border: 2px dashed #30363d; border-radius: 12px;
  padding: 34px 20px; text-align: center; cursor: pointer;
  transition: border-color .15s, background .15s;
  margin-bottom: 18px;
}
.upload:hover { border-color: #2b5bff; background: #1c2a4d22; }
.upload .icon { font-size: 34px; color: #8b949e; margin-bottom: 10px; }
.upload .main { font-size: 15px; font-weight: 600; color: #e8eaed; margin-bottom: 6px; }
.upload .sub { font-size: 12px; color: #8b949e; }
.upload.has-img { border-style: solid; border-color: #2b5bff; padding: 8px; }
.upload.has-img img { width: 100%; max-height: 240px; object-fit: contain; border-radius: 8px; display: block; }
.upload input[type=file] { display: none; }

/* 链接区 */
.or-line { display: flex; align-items: center; gap: 12px; color: #6e7681; font-size: 12px; margin-bottom: 14px; }
.or-line::before, .or-line::after { content: ""; flex: 1; height: 1px; background: #21262d; }
.link-row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.link-row label { font-size: 13px; color: #c9d1d9; flex-shrink: 0; }
.link-row input {
  flex: 1; background: #0e1117; border: 1px solid #30363d; border-radius: 8px;
  color: #e8eaed; padding: 9px 12px; font-size: 13px; outline: none;
}
.link-row input:focus { border-color: #2b5bff; }
.link-row button {
  background: #2b5bff; color: #fff; border: none; border-radius: 8px;
  padding: 9px 18px; font-size: 13px; cursor: pointer; flex-shrink: 0;
}
.link-row button:hover { background: #3d6bff; }
.link-row button:disabled { background: #21262d; color: #6e7681; cursor: not-allowed; }
.link-note { font-size: 12px; color: #8b949e; margin-bottom: 24px; }

/* 底部 */
.foot { display: flex; justify-content: flex-end; }
.cancel {
  background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
  border-radius: 8px; padding: 8px 24px; font-size: 13px; cursor: pointer;
}
.cancel:hover { background: #30363d; }

/* 加载态 */
.spinner {
  width: 14px; height: 14px; border: 2px solid #fff8; border-top-color: transparent;
  border-radius: 50%; display: inline-block; vertical-align: -2px;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="modal">
  <div class="head">
    <h2>创建场景</h2>
    <button class="close" id="closeBtn" title="关闭">×</button>
  </div>

  <div class="demo-tip"><span class="tag">交互演示</span>提供图片，核对资料，体验完整入库流程；不执行真实人物消除。</div>

  <div class="steps">
    <div class="step on"><span class="num">1</span>提供场景图片</div>
    <div class="step"><span class="num">2</span>确认入库资料</div>
  </div>

  <div class="upload" id="uploadBox">
    <input type="file" id="fileInput" accept="image/*">
    <div id="uploadInner">
      <div class="icon">🖼</div>
      <div class="main">上传场景图片</div>
      <div class="sub">选择一张图片，上传后自动进入资料确认</div>
    </div>
  </div>

  <div class="or-line">或</div>

  <div class="link-row">
    <label>图片链接</label>
    <input id="linkInput" placeholder="https://...图片直链" type="url">
    <button id="readBtn">读取图片</button>
  </div>
  <div class="link-note">仅支持可直接打开的图片链接，不解析商品页或社交平台页面。</div>

  <div class="foot">
    <button class="cancel" id="cancelBtn">取消</button>
  </div>
</div>

<script>
const box = document.getElementById('uploadBox');
const fileInput = document.getElementById('fileInput');
const uploadInner = document.getElementById('uploadInner');
const linkInput = document.getElementById('linkInput');
const readBtn = document.getElementById('readBtn');

// 本地选择图片 → 预览
box.addEventListener('click', ()=>fileInput.click());
fileInput.addEventListener('change', ()=>{
  const f = fileInput.files[0];
  if(!f) return;
  const url = URL.createObjectURL(f);
  box.classList.add('has-img');
  uploadInner.innerHTML = `<img src="${url}" alt="场景图片预览">`;
});

// 链接读取（演示：直接以链接预览）
readBtn.addEventListener('click', async ()=>{
  const url = linkInput.value.trim();
  if(!url){ linkInput.focus(); return; }
  readBtn.disabled = true;
  readBtn.innerHTML = '<span class="spinner"></span> 读取中';
  await new Promise(r=>setTimeout(r, 900));   // 模拟读取
  box.classList.add('has-img');
  uploadInner.innerHTML = `<img src="${url}" alt="场景图片预览" onerror="this.outerHTML='<div class=\'icon\'>⚠️</div><div class=\'main\'>图片加载失败</div><div class=\'sub\'>请确认链接可直接打开</div>'">`;
  readBtn.disabled = false;
  readBtn.textContent = '读取图片';
});

// 关闭 / 取消
document.getElementById('closeBtn').addEventListener('click', ()=>location.reload());
document.getElementById('cancelBtn').addEventListener('click', ()=>location.reload());
</script>
</body>
</html>
