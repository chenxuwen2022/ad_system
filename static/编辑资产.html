<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>编辑资产</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0e1117; color: #e8eaed; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; padding: 28px 32px; }
  h1 { font-size: 17px; margin-bottom: 20px; }
  .field { margin-bottom: 18px; }
  .label { font-size: 12.5px; color: #c9d1d9; margin-bottom: 7px; }
  .label .req { color: #ff7b72; }
  input[type=text], textarea { width: 100%; background: #161b22; border: 1px solid #30363d; border-radius: 8px; color: #e8eaed; font-size: 13.5px; padding: 10px 12px; outline: none; font-family: inherit; }
  input[type=text]:focus, textarea:focus { border-color: #2b5bff; }
  textarea { resize: vertical; min-height: 76px; line-height: 1.7; }
  select { width: 100%; background: #161b22; border: 1px solid #30363d; border-radius: 8px; color: #e8eaed; font-size: 13.5px; padding: 10px 12px; outline: none; cursor: pointer; }
  .imgbox { position: relative; width: 100%; height: 172px; border-radius: 10px; overflow: hidden; background: #161b22; border: 1px dashed #30363d; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .imgbox.has-img { border-style: solid; }
  .imgbox img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .imgbox .up { text-align: center; color: #8b949e; }
  .imgbox .up .ic { font-size: 30px; margin-bottom: 6px; }
  .imgbox .up .t { font-size: 13px; color: #c9d1d9; }
  .imgbox .up .s { font-size: 11px; margin-top: 4px; }
  .imgbox .change { position: absolute; right: 10px; bottom: 10px; background: #0e1117cc; color: #e8eaed; border: 1px solid #30363d; border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
  .ops { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
  .ops button { padding: 9px 28px; border-radius: 8px; font-size: 13px; cursor: pointer; border: none; }
  .cancel { background: #21262d; color: #c9d1d9; border: 1px solid #30363d !important; }
  .cancel:hover { background: #30363d; }
  .save { background: #2b5bff; color: #fff; font-weight: 600; }
  .save:hover { background: #3d6bff; }
  .save:disabled { opacity: .6; cursor: not-allowed; }
  #toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); padding: 9px 20px; border-radius: 8px; font-size: 13px; display: none; z-index: 99; color: #fff; }
</style>
</head>
<body>
  <div id="toast"></div>
  <h1 id="title">编辑资产</h1>

  <div class="field">
    <div class="label">素材名称 <span class="req">*</span></div>
    <input type="text" id="fName" placeholder="请输入素材名称">
  </div>

  <div class="field">
    <div class="label">分类</div>
    <select id="fCategory"></select>
  </div>

  <div class="field">
    <div class="label">一句话描述</div>
    <textarea id="fDesc" placeholder="用一句话描述素材特征与适用场景"></textarea>
  </div>

  <div class="field">
    <div class="label">标签（用顿号或逗号分隔）</div>
    <input type="text" id="fTags" placeholder="如：摄影棚、极简、专业">
  </div>

  <div class="field">
    <div class="label">素材图片</div>
    <div class="imgbox" id="imgBox">
      <div class="up" id="upHint"><div class="ic">🖼</div><div class="t">上传图片</div><div class="s">支持 jpg / png / webp</div></div>
    </div>
  </div>

  <div class="ops">
    <button class="cancel" id="cancelBtn">取消</button>
    <button class="save" id="saveBtn">保存</button>
  </div>

  <input type="file" id="fileInput" accept="image/*" style="display:none">

<script>
const CATS = {
  brand: '品牌资产库', reference: '参考素材', model: '模特库',
  outfit: '穿搭库', scene: '场景库'
};
const API = '/api/assets';
let editingId = null, pendingFile = null, origImage = '';

function $(id){ return document.getElementById(id); }
function toast(msg, err){ const t=$('toast'); t.textContent=msg; t.style.background=err?'#c23b3b':'#1f8b4c'; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', 2400); }

function init(){
  $('fCategory').innerHTML = Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  const q = new URLSearchParams(location.search);
  const id = q.get('id');
  if(!id){ toast('缺少资产 ID', true); return; }
  editingId = id;
  $('title').textContent = '编辑资产 · ' + id;
  loadAsset(id);
}

async function loadAsset(id){
  try{
    const r = await fetch(API);
    const j = await r.json();
    const it = (j.data.list || []).find(x=>x.id===id);
    if(!it){ toast('资产不存在', true); return; }
    $('fName').value = it.name || '';
    $('fCategory').value = it.category || 'scene';
    $('fDesc').value = it.description || '';
    $('fTags').value = it.tags || '';
    origImage = it.image || '';
    window._asset = it;   // 保留 dims / scope / image
    if(origImage) setImg(origImage, true);
    else showEmpty();
  }catch(e){ toast('加载失败: ' + e.message, true); }
}

function setImg(src, hasImg){
  $('imgBox').classList.add('has-img');
  $('imgBox').innerHTML = `<img src="${src}" alt="素材图片" onerror="imgFail()"><span class="change">更换图片</span>`;
  $('imgBox').onclick = ()=>$('fileInput').click();
}
function imgFail(){
  // 图片加载失败（文件被删/路径失效）→ 显示失效占位，可重新上传
  $('imgBox').classList.remove('has-img');
  $('imgBox').innerHTML = `<div class="up"><div class="ic">🖼</div><div class="t">素材图片加载失败</div><div class="s">原图文件已失效，点击重新上传</div></div>`;
  $('imgBox').onclick = ()=>$('fileInput').click();
}
function showEmpty(){
  $('imgBox').classList.remove('has-img');
  $('imgBox').innerHTML = `<div class="up" id="upHint"><div class="ic">🖼</div><div class="t">暂无素材图片</div><div class="s">点击上传图片（支持 jpg / png / webp）</div></div>`;
  $('imgBox').onclick = ()=>$('fileInput').click();
}
$('fileInput').addEventListener('change', ()=>{
  const f = $('fileInput').files[0];
  if(!f) return;
  pendingFile = f;
  setImg(URL.createObjectURL(f));
});

$('cancelBtn').onclick = ()=>{
  parent.postMessage({type:'asset-close'}, '*');
};

$('saveBtn').onclick = async ()=>{
  const name = $('fName').value.trim();
  if(!name){ toast('名称不能为空', true); return; }
  const it = window._asset || {};
  const fd = new FormData();
  fd.append('category', $('fCategory').value);
  fd.append('name', name);
  fd.append('description', $('fDesc').value.trim());
  fd.append('tags', $('fTags').value.trim());
  fd.append('scope', it.scope || 'mine');
  fd.append('dims', JSON.stringify(it.dims || {}));
  if(pendingFile) fd.append('image', pendingFile);
  else if(origImage && origImage.startsWith('/')) fd.append('image_url', origImage);
  $('saveBtn').disabled = true;
  $('saveBtn').textContent = '保存中…';
  try{
    const r = await fetch(API + '/' + encodeURIComponent(editingId), {method:'PUT', body:fd});
    const j = await r.json();
    if(j.code !== 0) throw new Error(j.detail || j.msg || '保存失败');
    toast('已保存修改');
    setTimeout(()=>parent.postMessage({type:'asset-saved', id: editingId}, '*'), 600);
  }catch(e){ toast('保存失败: '+e.message, true); }
  $('saveBtn').disabled = false;
  $('saveBtn').textContent = '保存';
};

init();
</script>
</body>
</html>
