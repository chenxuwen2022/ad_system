<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>创建场景 · 确认入库资料 - WellFlow AI 电商商拍创作平台</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #0e1117; color: #e8eaed; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { width: 1000px; max-width: 98vw; background: #161b22; border: 1px solid #30363d; border-radius: 16px; box-shadow: 0 18px 50px rgba(0,0,0,.55); }
.head { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px 0; }
.head h2 { font-size: 18px; font-weight: 700; }
.close { width: 30px; height: 30px; border-radius: 8px; background: #21262d; color: #8b949e; border: none; font-size: 16px; cursor: pointer; }
.close:hover { background: #30363d; color: #fff; }
.demo-tip { display: flex; gap: 8px; align-items: center; margin: 12px 24px 16px; background: #17233b; border: 1px solid #2b5bff44; border-radius: 8px; padding: 8px 12px; font-size: 12px; color: #7ea0ff; }
.demo-tip .tag { flex-shrink: 0; color: #ffd83d; font-weight: 600; }
.steps { display: flex; gap: 10px; padding: 0 24px; margin-bottom: 18px; }
.step { flex: 1; display: flex; align-items: center; gap: 8px; background: #21262d; border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #8b949e; }
.step .num { width: 22px; height: 22px; border-radius: 50%; background: #30363d; color: #8b949e; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
.step.on { background: #1c2a4d; border: 1px solid #2b5bff66; color: #c9d1d9; }
.step.on .num { background: #2b5bff; color: #fff; }

.body { display: flex; gap: 18px; padding: 0 24px 20px; }

/* ── 左：场景图预览 ── */
.left { flex: 2.2; min-width: 0; }
.preview-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.preview-title { font-size: 13px; font-weight: 600; }
.preview-tabs { display: flex; gap: 4px; background: #21262d; border-radius: 8px; padding: 3px; }
.preview-tabs span { padding: 4px 14px; border-radius: 6px; font-size: 12px; color: #8b949e; cursor: pointer; }
.preview-tabs span.on { background: #30363d; color: #e8eaed; }
.warn { display: flex; gap: 6px; align-items: center; font-size: 11px; color: #ffd83d; margin-bottom: 10px; }
.warn .tag2 { background: #ffd83d22; border: 1px solid #ffd83d55; color: #ffd83d; border-radius: 4px; padding: 1px 6px; font-size: 10px; flex-shrink: 0; }
.preview-box { height: 300px; border-radius: 12px; overflow: hidden; position: relative; background: linear-gradient(160deg,#d9c9a8 0%,#c9b18f 50%,#9c7f5d 100%); margin-bottom: 12px; display: flex; align-items: center; justify-content: center; }
.preview-box .ph { text-align: center; color: #3a2f22cc; }
.preview-box .ph .i { font-size: 40px; margin-bottom: 8px; }
.preview-box .ph .t { font-size: 14px; font-weight: 600; }
.preview-box .ph .s { font-size: 12px; margin-top: 4px; }
.preview-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
.preview-note { font-size: 11px; color: #8b949e; line-height: 1.7; margin-bottom: 12px; }
.preview-ops { display: flex; gap: 8px; }
.preview-ops button { flex: 1; padding: 7px 0; border-radius: 8px; font-size: 12px; background: #21262d; color: #c9d1d9; border: 1px solid #30363d; cursor: pointer; }
.preview-ops button:hover { background: #30363d; }
.preview-ops .primary { background: #2b5bff; border-color: #2b5bff; color: #fff; }
.preview-ops .primary:hover { background: #3d6bff; }

/* ── 右：入库资料 ── */
.right { flex: 3.4; min-width: 0; }
.row { margin-bottom: 14px; }
.row label { display: block; font-size: 12px; color: #8b949e; margin-bottom: 5px; }
.row input[type=text], .row textarea { width: 100%; background: #0e1117; border: 1px solid #30363d; border-radius: 8px; color: #e8eaed; padding: 9px 12px; font-size: 13px; outline: none; }
.row input:focus, .row textarea:focus { border-color: #2b5bff; }
.field-pair { display: flex; align-items: center; gap: 10px; }
.field-pair .id-box { background: #0e1117; border: 1px solid #30363d; border-radius: 8px; padding: 9px 12px; font-size: 13px; color: #ffd83d; width: 140px; text-align: center; flex-shrink: 0; }
.field-pair .name-input { flex: 1; }

/* 多选维度 */
.dim-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.dim-cell { position: relative; }
.dim-btn { width: 100%; text-align: left; background: #0e1117; border: 1px solid #30363d; border-radius: 8px; color: #e8eaed; padding: 8px 10px; font-size: 12px; cursor: pointer; outline: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dim-btn:hover, .dim-btn:focus { border-color: #2b5bff; }
.dim-btn .arr { float: right; color: #8b949e; }
.dim-btn.has-val { border-color: #2b5bff66; background: #1c2a4d; color: #ffd83d; }
.dim-panel { position: absolute; top: calc(100% + 4px); left: 0; z-index: 30; background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 10px; min-width: 260px; box-shadow: 0 8px 24px rgba(0,0,0,.5); display: none; }
.dim-panel.open { display: block; }
.dim-panel .vals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.dim-panel .val { text-align: center; padding: 6px 4px; border-radius: 6px; font-size: 12px; background: #21262d; color: #c9d1d9; cursor: pointer; user-select: none; }
.dim-panel .val.on { background: #2b5bff; color: #fff; }
.dim-panel .panel-ops { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 8px; border-top: 1px solid #21262d; font-size: 11px; color: #8b949e; }
.dim-panel .panel-ops span { cursor: pointer; }
.dim-panel .panel-ops span:hover { color: #ffd83d; }
.style-row { grid-column: 1 / -1; }

.tag-meta { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.tag-meta .sel-n { font-size: 12px; color: #7ea0ff; }
.tag-meta .clear { font-size: 12px; color: #8b949e; cursor: pointer; text-decoration: underline; }
.tag-tip { font-size: 11px; color: #6e7681; margin-top: 6px; }

.desc-wrap { position: relative; }
.desc-wrap textarea { min-height: 72px; resize: vertical; }
.desc-ops { display: flex; justify-content: space-between; margin-top: 6px; }
.desc-ops .left-ops { display: flex; gap: 8px; }
.desc-ops button { padding: 5px 12px; border-radius: 6px; font-size: 11px; background: #21262d; color: #c9d1d9; border: 1px solid #30363d; cursor: pointer; }
.desc-ops button:hover { background: #30363d; }
.desc-ops .gen { background: #2b5bff; border-color: #2b5bff; color: #fff; }
.desc-tip { font-size: 11px; color: #6e7681; margin-top: 6px; }

.foot { display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 14px 24px 18px; border-top: 1px solid #21262d; }
.foot .cancel { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 8px; padding: 8px 22px; font-size: 13px; cursor: pointer; }
.foot .note { font-size: 11px; color: #6e7681; }
.foot .confirm { background: #ffd83d; color: #0e1117; border: none; border-radius: 8px; padding: 9px 26px; font-size: 13px; font-weight: 600; cursor: pointer; }
.foot .confirm:hover { background: #ffe066; }
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1f8b4c; color: #fff; border-radius: 8px; padding: 10px 22px; font-size: 13px; z-index: 200; display: none; }
</style>
</head>
<body>
<div class="modal">
  <div class="head">
    <h2>创建场景</h2>
    <button class="close" id="closeBtn" title="关闭">×</button>
  </div>

  <div class="demo-tip"><span class="tag">交互演示</span>提供图片，核对资料，体验完整入库流程；不执行真实人物消除。</div>

  <div class="steps">
    <div class="step"><span class="num">1</span>提供场景图片</div>
    <div class="step on"><span class="num">2</span>确认入库资料</div>
  </div>

  <div class="body">
    <!-- 左：场景图预览 -->
    <div class="left">
      <div class="preview-head">
        <span class="preview-title">场景图·演示预览</span>
        <div class="preview-tabs"><span class="on">场景图</span><span>原图</span><span>交互演示</span></div>
      </div>
      <div class="warn"><span class="tag2">交互演示</span>标签为预设示例，请核对修改；当前图片未经人物识别或消除。</div>
      <div class="preview-box" id="previewBox">
        <div class="ph"><div class="i">🖼</div><div class="t">场景图预览</div><div class="s">沿用上传原图 · 演示</div></div>
      </div>
      <div class="preview-note">
        演示预览沿用上传原图，未实际消除人物；入库后仍可切换查看原图。<br>
        原图完整保留，与场景图归入同一条资产。
      </div>
      <div class="preview-ops">
        <button id="changeImg">更换图片</button>
        <button class="primary">重新整理（演示）</button>
      </div>
    </div>

    <!-- 右：入库资料 -->
    <div class="right">
      <div class="row">
        <label>场景编号 · 自动分配</label>
        <div class="field-pair">
          <div class="id-box">WF-S011</div>
          <input type="text" class="name-input" value="屏幕截图2026-09-15 103130" placeholder="输入场景名称">
        </div>
      </div>

      <div class="row">
        <label>场景标签 · 可修改（每个维度支持多选）</label>
        <div class="dim-grid" id="dimGrid"></div>
        <div class="tag-meta">
          <span class="sel-n" id="selCount">已选 0 项</span>
          <span class="clear" id="clearTags">清空标签</span>
        </div>
        <div class="tag-tip">与场景库筛选使用同一组标签，无法判断的维度可留空。</div>
      </div>

      <div class="row">
        <label>一句话素材描述</label>
        <div class="desc-wrap">
          <textarea id="descArea" placeholder="输入素材描述"></textarea>
          <div class="desc-ops">
            <div class="left-ops">
              <button id="genDesc" class="gen">按标签更新</button>
              <button id="clearDesc">清空本项</button>
              <button id="doneDesc">完成</button>
            </div>
          </div>
        </div>
        <div class="desc-tip">描述随标签自动更新，概括所有已选标签。</div>
      </div>
    </div>
  </div>

  <div class="foot">
    <button class="cancel" id="cancelBtn">取消</button>
    <span class="note">演示资产仅保留在当前会话</span>
    <button class="confirm" id="confirmBtn">确认入库</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DIMS = {
  '空间类型': ['纯色棚拍','摄影棚','客厅','卧室','厨房','卫生间','办公室','商场','街道','公园','体育场','健身房','山林','雪山','沙滩','营地','岩壁'],
  '地域环境': ['城市街头','城市','海边','森林','建筑','乡村','山区','雪原','湖畔','广场'],
  '季节': ['春','夏','秋','冬'],
  '天气': ['晴天','阴天','雨天','雪天','雾','日落','夜晚'],
  '背景风格': ['极简','专业','温馨','自然','轻奢','高级','复古','科技','清新','国潮'],
};
const DIM_ORDER = ['空间类型','地域环境','季节','天气','背景风格'];
// 初始选中（示例）
const INIT_SEL = {
  '空间类型': ['摄影棚','卫生间'],
  '地域环境': ['城市街头'],
  '季节': [],
  '天气': ['晴天'],
  '背景风格': ['极简','专业'],
};
let sel = JSON.parse(JSON.stringify(INIT_SEL));

function $(id){ return document.getElementById(id); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', 2400); }

/* 渲染多选维度 */
function renderDims(){
  $('dimGrid').innerHTML = DIM_ORDER.map(k=>`
    <div class="dim-cell${k==='背景风格'?' style-row':''}">
      <button class="dim-btn" data-dim="${k}" title="${k}"><span class="dim-label">${k}</span><span class="arr">▾</span></button>
      <div class="dim-panel" data-panel="${k}">
        <div class="vals">${DIMS[k].map(v=>`<span class="val" data-v="${v}">${v}</span>`).join('')}</div>
        <div class="panel-ops"><span class="select-all">全选</span><span class="reset">清空该项</span></div>
      </div>
    </div>`).join('');
  refreshAll();
}
function refreshAll(){
  // 按钮文本
  document.querySelectorAll('.dim-btn').forEach(btn=>{
    const k = btn.dataset.dim;
    const vals = sel[k] || [];
    const label = btn.querySelector('.dim-label');
    if(vals.length){
      label.textContent = vals.map(v=>`${k}/${v}`).join('、');
      btn.classList.add('has-val');
    } else {
      label.textContent = k;
      btn.classList.remove('has-val');
    }
  });
  // 面板高亮
  document.querySelectorAll('.dim-panel').forEach(p=>{
    const k = p.dataset.panel;
    p.querySelectorAll('.val').forEach(v=>v.classList.toggle('on', (sel[k]||[]).includes(v.dataset.v)));
  });
  // 计数
  const n = DIM_ORDER.reduce((s,k)=>s+(sel[k]||[]).length, 0);
  $('selCount').textContent = `已选 ${n} 项`;
}

/* 交互 */
$('dimGrid').addEventListener('click', e=>{
  const btn = e.target.closest('.dim-btn');
  if(btn){
    document.querySelectorAll('.dim-panel.open').forEach(p=>p.classList.remove('open'));
    btn.parentElement.querySelector('.dim-panel').classList.toggle('open');
    return;
  }
  const val = e.target.closest('.val');
  if(val){
    const k = val.closest('.dim-panel').dataset.panel;
    const v = val.dataset.v;
    const arr = sel[k] || (sel[k]=[]);
    const i = arr.indexOf(v);
    if(i>=0) arr.splice(i,1); else arr.push(v);
    refreshAll();
    return;
  }
  const op = e.target.closest('.panel-ops span');
  if(op){
    const k = op.closest('.dim-panel').dataset.panel;
    if(op.classList.contains('select-all')) sel[k] = [...DIMS[k]];
    else sel[k] = [];
    refreshAll();
  }
});
document.addEventListener('click', ()=>document.querySelectorAll('.dim-panel.open').forEach(p=>p.classList.remove('open')));

/* 清空标签 */
$('clearTags').onclick = ()=>{
  DIM_ORDER.forEach(k=>sel[k]=[]);
  refreshAll();
  toast('已清空全部标签');
};

/* 描述操作 */
$('genDesc').onclick = ()=>{
  const parts = DIM_ORDER.filter(k=>(sel[k]||[]).length).map(k=>`${k}：${sel[k].join('、')}`);
  $('descArea').value = `场景特征：${parts.join('；')}。整体适合商品拍摄。`;
  toast('已按标签更新描述');
};
$('clearDesc').onclick = ()=>{ $('descArea').value=''; toast('已清空描述'); };
$('doneDesc').onclick = ()=>toast('描述已保存');

/* 图片显示（sessionStorage） */
(function(){
  const img = sessionStorage.getItem('scene_img');
  const type = sessionStorage.getItem('scene_img_type') || '';
  const box = $('previewBox');
  if(img && (type==='data' || type==='url')){
    box.innerHTML = `<img src="${img}" alt="场景图"
      onerror="this.outerHTML='<div class=\\'ph\\'><div class=\\'i\\'>⚠️</div><div class=\\'t\\'>图片加载失败</div></div>'">`;
  }
})();

/* 联动父页面 */
function notifyParent(type, extra){
  if(window.parent && window.parent !== window){
    window.parent.postMessage(Object.assign({type}, extra||{}), '*');
  }
}
$('changeImg').addEventListener('click', ()=>location.href='创建场景.html');
$('confirmBtn').onclick = ()=>{
  notifyParent('asset-saved', {id:'WF-S011'});
  toast('✅ 场景已入库');
};
$('cancelBtn').onclick = $('closeBtn').onclick = ()=>{
  notifyParent('asset-close');
  if(!(window.parent && window.parent !== window)) location.reload();
};

renderDims();
</script>
</body>
</html>
