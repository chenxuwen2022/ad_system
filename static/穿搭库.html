<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>穿搭库 - WellFlow AI 电商商拍创作平台</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f3f5f8; color: #1f2733; line-height: 1.6; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 24px 20px 60px; }
header { background: linear-gradient(135deg,#1f6feb,#0aa5a5); color:#fff;
  border-radius:14px; padding:20px 26px; margin-bottom:18px;
  box-shadow:0 6px 18px rgba(31,111,235,.18); display:flex;
  justify-content:space-between; align-items:center; }
header h1 { font-size:21px; font-weight:700; }
header p { font-size:13px; opacity:.92; margin-top:3px; }
.btn { display:inline-block; border:none; cursor:pointer; border-radius:8px;
  padding:8px 16px; font-size:14px; background:#eaeef4; color:#1f2733; }
.btn.primary { background:#1f6feb; color:#fff; }
.btn.ghost { background:transparent; border:1px solid #cfd8e3; color:#33415c; }
.btn.sm { padding:5px 12px; font-size:13px; }
.btn.danger { color:#d93026; background:#fdecea; }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.card { background:#fff; border-radius:14px; padding:18px 20px; margin-bottom:16px;
  box-shadow:0 2px 10px rgba(20,40,80,.06); border:1px solid #eaeef4; }
.toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.seg { display:inline-flex; background:#eaeef4; border-radius:9px; padding:3px; }
.seg button { border:none; background:transparent; padding:6px 16px; border-radius:7px;
  cursor:pointer; font-size:13px; color:#4a5568; }
.seg button.on { background:#fff; color:#1f6feb; font-weight:600; box-shadow:0 1px 4px rgba(0,0,0,.08); }
input[type=text], input[type=file], textarea { width:100%; padding:8px 12px; border:1px solid #cfd8e3;
  border-radius:8px; font-size:14px; background:#fff; }
input[type=text]:focus, textarea:focus { outline:none; border-color:#1f6feb; }
#q { width:260px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:16px; margin-top:16px; }
.item { background:#fff; border:1px solid #eaeef4; border-radius:12px; overflow:hidden;
  transition:box-shadow .15s; position:relative; }
.item:hover { box-shadow:0 6px 20px rgba(20,40,80,.12); }
.item .cover { aspect-ratio:4/3; background:#f0f2f6; position:relative; overflow:hidden; }
.item .cover img { width:100%; height:100%; object-fit:cover; display:block; }
.item .cover .ph { width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  color:#9aa4b2; font-size:12px; }
.item .cid { position:absolute; top:8px; left:8px; background:rgba(0,0,0,.55); color:#fff;
  font-size:11px; padding:2px 8px; border-radius:6px; }
.item .scope-tag { position:absolute; top:8px; right:8px; font-size:11px; padding:2px 8px;
  border-radius:6px; color:#fff; }
.item .scope-tag.official { background:#1f6feb; }
.item .scope-tag.mine { background:#0aa5a5; }
.item .meta { padding:10px 12px 12px; }
.item .name { font-size:14px; font-weight:600; }
.item .tags { font-size:12px; color:#7a8699; margin-top:4px; }
.item .ops { display:flex; gap:8px; margin-top:10px; }
.dim-bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.dd { position:relative; }
.dd > button { border:1px solid #cfd8e3; background:#fff; border-radius:8px; padding:7px 12px;
  cursor:pointer; font-size:13px; color:#33415c; }
.dd > button.has { border-color:#1f6feb; color:#1f6feb; }
.dd .panel { display:none; position:absolute; top:42px; left:0; z-index:30; background:#fff;
  border:1px solid #eaeef4; border-radius:12px; box-shadow:0 10px 30px rgba(20,40,80,.18);
  padding:12px; width:230px; max-height:320px; overflow:auto; }
.dd.open .panel { display:block; }
.dd .panel h5 { font-size:12px; color:#7a8699; margin:6px 0 4px; }
.dd .panel label { display:flex; align-items:center; gap:6px; font-size:13px; padding:3px 0;
  cursor:pointer; color:#33415c; }
.dd .panel label:hover { color:#1f6feb; }
.dd .panel .foot { display:flex; justify-content:space-between; margin-top:8px; padding-top:8px;
  border-top:1px solid #eaeef4; }
.empty { text-align:center; color:#9aa4b2; padding:60px 0; }
/* 详情弹窗 */
.modal-mask { display:none; position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:100;
  align-items:flex-start; justify-content:center; padding:30px 16px; overflow:auto; }
.modal-mask.show { display:flex; }
.modal { background:#fff; border-radius:16px; width:860px; max-width:100%; padding:20px 22px; }
.modal h2 { font-size:17px; margin-bottom:12px; display:flex; justify-content:space-between; }
.modal .x { cursor:pointer; color:#7a8699; font-size:20px; line-height:1; }
.gallery { display:flex; gap:14px; }
.gallery .main { flex:1; height:430px; background:#f0f2f6; border-radius:10px; display:flex;
  align-items:center; justify-content:center; cursor:zoom-in; overflow:hidden; }
.gallery .main img { max-width:100%; max-height:100%; object-fit:contain; }
.gallery .thumbs { width:86px; display:flex; flex-direction:column; gap:8px; overflow:auto; }
.gallery .thumbs img { width:86px; height:64px; object-fit:cover; border-radius:8px; cursor:pointer;
  border:2px solid transparent; }
.gallery .thumbs img.on { border-color:#1f6feb; }
.gallery .thumbs .lbl { font-size:10px; color:#7a8699; text-align:center; }
.gal-nav { display:flex; justify-content:center; gap:10px; margin-top:10px; }
.meta-box { margin-top:14px; border-top:1px solid #eaeef4; padding-top:12px; font-size:13px; }
.meta-box .row { margin:4px 0; color:#4a5568; }
.meta-box .row b { color:#1f2733; }
.ai-note { background:#eef6ff; border:1px solid #cfe3fb; color:#1f5fb0; border-radius:8px;
  padding:8px 12px; font-size:12px; margin-top:10px; }
.lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:200;
  align-items:center; justify-content:center; cursor:zoom-out; }
.lightbox.show { display:flex; }
.lightbox img { max-width:94vw; max-height:94vh; }
/* 编辑弹窗 */
.form-row { margin-bottom:12px; }
.form-row label { display:block; font-size:13px; color:#4a5568; margin-bottom:4px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { border:1px solid #cfd8e3; background:#fff; border-radius:20px; padding:4px 12px;
  font-size:12px; cursor:pointer; color:#4a5568; }
.chip.on { background:#1f6feb; border-color:#1f6feb; color:#fff; }
.dim-group { margin-bottom:10px; }
.dim-group h5 { font-size:12px; color:#7a8699; margin-bottom:5px; }
#toast { position:fixed; top:20px; right:20px; z-index:300; display:flex; flex-direction:column; gap:8px; }
#toast .t { background:#1f2733; color:#fff; padding:10px 16px; border-radius:8px; font-size:13px;
  box-shadow:0 6px 18px rgba(0,0,0,.25); animation:fadein .2s; }
#toast .t.err { background:#c0392b; }
@keyframes fadein { from { opacity:0; transform:translateY(-6px); } to { opacity:1; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>穿搭库</h1>
      <p>统一管理服装搭配资产 · 官方精选 + 个人沉淀</p>
    </div>
    <a class="btn primary" href="/static/创建穿搭.html">＋ 创建穿搭</a>
  </header>

  <div class="card">
    <div class="toolbar">
      <div class="seg" id="scopeSeg">
        <button data-scope="">全部</button>
        <button data-scope="official">官方资产</button>
        <button data-scope="mine">我的资产</button>
      </div>
      <input type="text" id="q" placeholder="搜索编号 / 名称 / 标签(如:极简 夏)">
      <button class="btn primary sm" id="searchBtn">搜索</button>
      <span style="flex:1"></span>
      <button class="btn ghost sm" id="clearBtn">清空筛选</button>
    </div>
    <div class="dim-bar" id="dimBar" style="margin-top:12px"></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">没有找到匹配的穿搭</div>
</div>

<!-- 详情弹窗 -->
<div class="modal-mask" id="detailMask">
  <div class="modal">
    <h2><span id="dName"></span><span class="x" onclick="closeDetail()">✕</span></h2>
    <div class="gallery">
      <div class="main" id="galMain" onclick="openLightbox()"></div>
      <div class="thumbs" id="galThumbs"></div>
    </div>
    <div class="gal-nav">
      <button class="btn sm" onclick="galMove(-1)">‹ 上一张</button>
      <span id="galIdx" style="font-size:13px;color:#7a8699"></span>
      <button class="btn sm" onclick="galMove(1)">下一张 ›</button>
    </div>
    <div class="meta-box" id="dMeta"></div>
    <div class="ai-note" id="dAiNote" style="display:none"></div>
  </div>
</div>

<!-- 大图 -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()"><img id="lbImg"></div>

<!-- 编辑弹窗 -->
<div class="modal-mask" id="editMask">
  <div class="modal">
    <h2><span>编辑穿搭</span><span class="x" onclick="closeEdit()">✕</span></h2>
    <div class="form-row"><label>名称</label><input type="text" id="eName"></div>
    <div class="form-row"><label>一句话素材描述</label><textarea id="eDesc" rows="2"></textarea></div>
    <div class="form-row"><label>标签(逗号分隔)</label><input type="text" id="eTags"></div>
    <div class="form-row"><label>维度标签</label><div id="eDims"></div></div>
    <div class="form-row"><label>更换平铺总图(可选)</label><input type="file" id="eCover" accept="image/*"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px">
      <button class="btn" onclick="closeEdit()">取消</button>
      <button class="btn primary" id="eSaveBtn" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let dimsDef = {};          // 维度定义(来自 /api/outfit/dimensions)
let filterDims = {};       // 筛选态
let editDims = {};         // 编辑态
let allItems = [];         // 当前列表
let curDetail = null;      // 详情记录
let galImgs = [], galIdx = 0;
let editingId = null;

function toast(msg, isErr) {
  const d = document.createElement('div');
  d.className = 't' + (isErr ? ' err' : '');
  d.textContent = msg;
  document.getElementById('toast').appendChild(d);
  setTimeout(() => d.remove(), 2600);
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok && j.code !== 0) { const e = new Error(j.msg || j.detail || ('HTTP ' + r.status)); e.status = r.status; throw e; }
  return j;
}

// ---------- 维度定义与筛选 ----------
async function loadDims() {
  const j = await api('/api/outfit/dimensions');
  dimsDef = j.data.groups;
  Object.keys(dimsDef).forEach(k => filterDims[k] = []);
  renderDimBar();
}

function renderDimBar() {
  const bar = document.getElementById('dimBar');
  bar.innerHTML = '';
  Object.entries(dimsDef).forEach(([key, def]) => {
    const dd = document.createElement('div');
    dd.className = 'dd';
    const n = (filterDims[key] || []).length;
    dd.innerHTML = `<button class="${n ? 'has' : ''}" onclick="toggleDD(this,'${key}')">${def.label}${n ? ' · ' + n : ''} ▾</button>`;
    let optsHtml = '';
    if (def.groups) {
      def.groups.forEach(g => {
        optsHtml += `<h5>${g.label}</h5>` + g.options.map(o => optHtml(key, o)).join('');
      });
    } else {
      optsHtml += def.options.map(o => optHtml(key, o)).join('');
    }
    optsHtml += `<div class="foot"><button class="btn sm" onclick="clearDim('${key}')">清空本项</button>
      <button class="btn primary sm" onclick="closeAllDD()">完成</button></div>`;
    dd.innerHTML += `<div class="panel">${optsHtml}</div>`;
    bar.appendChild(dd);
  });
  syncDimButtons();
}
function optHtml(key, o) {
  const on = (filterDims[key] || []).includes(o);
  return `<label><input type="checkbox" ${on ? 'checked' : ''} onchange="setDim('${key}','${o}',this.checked)">
    <span>${o}</span></label>`;
}
function toggleDD(btn, key) {
  const dd = btn.parentElement;
  const open = dd.classList.contains('open');
  closeAllDD();
  if (!open) dd.classList.add('open');
}
function closeAllDD() { document.querySelectorAll('.dd').forEach(d => d.classList.remove('open')); }
function setDim(key, val, on) {
  const arr = filterDims[key] || [];
  if (on && !arr.includes(val)) arr.push(val);
  if (!on) { const i = arr.indexOf(val); if (i >= 0) arr.splice(i, 1); }
  renderDimBar();
}
function clearDim(key) { filterDims[key] = []; renderDimBar(); }
function syncDimButtons() {
  document.querySelectorAll('.dd > button').forEach(b => {
    const key = b.getAttribute('onclick').match(/'([^']+)'/)[1];
    const n = (filterDims[key] || []).length;
    b.className = n ? 'has' : '';
    b.textContent = `${dimsDef[key].label}${n ? ' · ' + n : ''} ▾`;
  });
}

// ---------- 列表 ----------
async function loadList() {
  const scope = document.querySelector('#scopeSeg button.on').dataset.scope;
  const q = document.getElementById('q').value.trim();
  const active = {};
  Object.entries(filterDims).forEach(([k, v]) => { if (v.length) active[k] = v; });
  const params = new URLSearchParams({ category: 'outfit' });
  if (scope) params.set('scope', scope);
  if (q) params.set('q', q);
  if (Object.keys(active).length) params.set('dims', JSON.stringify(active));
  const j = await api('/api/assets?' + params.toString());
  allItems = j.data.list || [];
  renderList();
}

function renderList() {
  const grid = document.getElementById('grid');
  document.getElementById('empty').style.display = allItems.length ? 'none' : '';
  grid.innerHTML = allItems.map(it => {
    const cover = it.cover || it.image || '';
    const scopeLabel = it.scope === 'official' ? '官方' : '我的';
    const mine = it.scope !== 'official';
    const ops = `<button class="btn sm" onclick="openDetail('${it.id}')">详情</button>` +
      (mine ? `<button class="btn sm" onclick="openEdit('${it.id}')">编辑</button>
               <button class="btn sm danger" onclick="delOutfit('${it.id}')">删除</button>` : '');
    return `<div class="item">
      <div class="cover">${cover ? `<img src="${cover}" onerror="this.parentElement.innerHTML='<div class=ph>暂无封面</div>'">`
        : '<div class="ph">暂无封面</div>'}
        <span class="cid">ID · ${it.id}</span>
        <span class="scope-tag ${it.scope === 'official' ? 'official' : 'mine'}">${scopeLabel}</span>
      </div>
      <div class="meta">
        <div class="name">${esc(it.name)}</div>
        <div class="tags">${esc(it.tags || '')}</div>
        <div class="ops">${ops}</div>
      </div>
    </div>`;
  }).join('');
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- 详情 ----------
function openDetail(id) {
  curDetail = allItems.find(x => x.id === id);
  if (!curDetail) return;
  galImgs = [];
  if (curDetail.original) galImgs.push({ src: curDetail.original, label: '上传原图' });
  (curDetail.items || []).forEach(it => {
    if (it.image) galImgs.push({ src: it.image, label: it.name || '单品图' });
  });
  if (curDetail.cover && curDetail.cover !== curDetail.original) galImgs.push({ src: curDetail.cover, label: '平铺总图' });
  if (!galImgs.length) galImgs.push({ src: curDetail.cover || curDetail.image, label: '封面' });
  galIdx = 0;
  document.getElementById('dName').textContent = curDetail.id + ' · ' + curDetail.name;
  const dimsTxt = Object.values(curDetail.dims || {}).flat().filter(Boolean).join(' · ') || '—';
  document.getElementById('dMeta').innerHTML =
    `<div class="row"><b>素材编号:</b>${curDetail.id}　<b>来源:</b>${curDetail.scope === 'official' ? '官方' : '我的'}</div>
     <div class="row"><b>维度标签:</b>${esc(dimsTxt)}</div>
     <div class="row"><b>素材描述:</b>${esc(curDetail.desc || '')}</div>`;
  const aiNote = document.getElementById('dAiNote');
  if (curDetail.origin === 'ai' || curDetail.origin === 'demo') {
    const n = (curDetail.items || []).length;
    aiNote.style.display = '';
    aiNote.textContent = `已保存原图、平铺总图与 ${n} 件单品图。单品图由原图经 AI 提取,可切换并放大查看`;
  } else aiNote.style.display = 'none';
  renderGallery();
  document.getElementById('detailMask').classList.add('show');
}
function renderGallery() {
  const g = galImgs[galIdx];
  document.getElementById('galMain').innerHTML = `<img src="${g.src}" onerror="this.alt='图片加载失败'">`;
  document.getElementById('galThumbs').innerHTML = galImgs.map((im, i) =>
    `<div><img class="${i === galIdx ? 'on' : ''}" src="${im.src}" onclick="galIdx=${i};renderGallery()" onerror="this.style.display='none'">
     <div class="lbl">${esc(im.label)}</div></div>`).join('');
  document.getElementById('galIdx').textContent = `${galIdx + 1} / ${galImgs.length}`;
}
function galMove(d) { galIdx = (galIdx + d + galImgs.length) % galImgs.length; renderGallery(); }
function closeDetail() { document.getElementById('detailMask').classList.remove('show'); }
function openLightbox() { document.getElementById('lbImg').src = galImgs[galIdx].src; document.getElementById('lightbox').classList.add('show'); }
function closeLightbox() { document.getElementById('lightbox').classList.remove('show'); }

// ---------- 编辑 ----------
function openEdit(id) {
  const it = allItems.find(x => x.id === id);
  if (!it) return;
  editingId = id;
  document.getElementById('eName').value = it.name || '';
  document.getElementById('eDesc').value = it.desc || '';
  document.getElementById('eTags').value = it.tags || '';
  document.getElementById('eCover').value = '';
  editDims = {};
  Object.keys(dimsDef).forEach(k => editDims[k] = [...((it.dims || {})[k] || [])]);
  renderEditDims();
  document.getElementById('editMask').classList.add('show');
}
function renderEditDims() {
  const box = document.getElementById('eDims');
  box.innerHTML = Object.entries(dimsDef).map(([key, def]) => {
    let opts = [];
    if (def.groups) def.groups.forEach(g => opts = opts.concat(g.options));
    else opts = def.options;
    return `<div class="dim-group"><h5>${def.label}</h5><div class="chips">` +
      opts.map(o => `<span class="chip ${(editDims[key] || []).includes(o) ? 'on' : ''}"
        onclick="toggleChip('${key}','${o}',this)">${o}</span>`).join('') + '</div></div>';
  }).join('');
}
function toggleChip(key, val, el) {
  const arr = editDims[key] || [];
  const i = arr.indexOf(val);
  if (i >= 0) arr.splice(i, 1); else arr.push(val);
  el.classList.toggle('on');
}
function closeEdit() { document.getElementById('editMask').classList.remove('show'); }

async function saveEdit() {
  const fd = new FormData();
  fd.append('name', document.getElementById('eName').value.trim());
  fd.append('desc', document.getElementById('eDesc').value.trim());
  fd.append('tags', document.getElementById('eTags').value.trim());
  fd.append('dims', JSON.stringify(editDims));
  const coverFile = document.getElementById('eCover').files[0];
  document.getElementById('eSaveBtn').disabled = true;
  try {
    if (coverFile) {
      const ufd = new FormData(); ufd.append('file', coverFile);
      const up = await api('/api/outfit/upload', { method: 'POST', body: ufd });
      fd.append('cover_url', up.data.url);
    }
    await api('/api/outfit/' + editingId, { method: 'PUT', body: fd });
    toast('保存成功');
    closeEdit();
    loadList();
  } catch (e) {
    toast('保存失败:' + e.message, true);
  } finally {
    document.getElementById('eSaveBtn').disabled = false;
  }
}

// ---------- 删除 ----------
async function delOutfit(id) {
  if (!confirm('确认删除该穿搭?记录与全部关联图片将被移除,不可恢复。')) return;
  try {
    await api('/api/outfit/' + id, { method: 'DELETE' });
    toast('已删除');
    loadList();
  } catch (e) {
    toast('删除失败:' + e.message, true);
  }
}

// ---------- 初始化 ----------
document.getElementById('scopeSeg').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  document.querySelectorAll('#scopeSeg button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  loadList();
});
document.getElementById('searchBtn').onclick = loadList;
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') loadList(); });
document.getElementById('clearBtn').onclick = () => {
  Object.keys(filterDims).forEach(k => filterDims[k] = []);
  document.getElementById('q').value = '';
  document.querySelectorAll('#scopeSeg button').forEach((x, i) => x.classList.toggle('on', i === 0));
  renderDimBar();
  loadList();
};
document.addEventListener('click', e => { if (!e.target.closest('.dd')) closeAllDD(); });

(async () => {
  try {
    await loadDims();
    await loadList();
  } catch (e) {
    toast('加载失败:' + e.message, true);
  }
})();
</script>
</body>
</html>
