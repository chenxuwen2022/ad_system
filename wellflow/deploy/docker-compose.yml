name: shuyu-workflow-backend

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # .env 放在项目根目录（只有这一份），deploy/ 只是部署入口
    env_file:
      - ../../.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wellflow
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d wellflow" ]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 容器内数据库主机名是 service 名 db，不是 localhost
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@db:5432/wellflow
      DATABASE_URL_ASYNC: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/wellflow
      NEWAPI_API_KEY: ${NEWAPI_API_KEY}
      APP_ENV: production
      # 服务器上没有本地 127.0.0.1:7890 代理，置空禁用（否则 Node1 调研工具会连不上）
      HTTP_PROXY_URL: ""
    volumes:
      # 生成图/上传图落盘到宿主机 /data/wellflow/uploads，便于备份与迁移
      - /data/wellflow/uploads:/app/uploads
    ports:
      - "8000:8000"

volumes:
  pgdata:
